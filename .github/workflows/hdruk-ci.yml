# HDR UK CI
#
# The workflows inherited from upstream only run on pushes to `master`,
# which does not exist in this fork, and they upload coverage to codecov,
# which needs a token this fork does not have. This file runs the same
# lint, test and build steps on the HDR UK branches instead, so the
# upstream workflow files can stay untouched and rebase cleanly.
#
# It reports only. It must not gate merges yet: do not make it a required
# status check until the suite is known to be green.

name: HDR UK CI

on:
  push:
    branches:
      - 'hdr-uk/**'
      - 'upgrade/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check package-lock.json is unchanged
        run: make validate-no-uncommitted-package-lock-changes

      - name: Extract i18n messages
        run: npm run i18n_extract

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Audit dependencies against the allowlist
        run: npm run audit:allowlisted
